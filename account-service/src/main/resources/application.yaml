spring:
  application:
    name: account-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: ${ACCOUNT_SERVER_PORT:8083}
bank:
  time-zone: ${BANK_TIME_ZONE:America/Guayaquil}
